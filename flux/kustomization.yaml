apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo-demo
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: rewind-demo
  path: ./apps/podinfo
  prune: true
  wait: true
  targetNamespace: demo
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: podinfo
      namespace: demo
